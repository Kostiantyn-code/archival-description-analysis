schema_version: 1
language: ru
name: Russian
vocabulary: weighted_rules
matching: ru_light
version: 0.8-draft
validation_status: not_independently_validated
categories:
  politics:
    minimum_score: 3
    strong_phrases: [политическая проверка, политическая благонадежность, политическая неблагонадежность,
      политический надзор, политическое преступление, государственное преступление, тайное общество, польское
        восстание, революционное воззвание, нелегальная литература, политический заключенный, усиленная
        охрана, против царя, против правительства, революционная пропаганда, подстрекательство к бунту,
      еврейский погром, покушение на царский поезд, студенческие волнения, революционные воззвания]
    strong_terms: [политический, революционный, революция, восстание, бунт, прокламация, социализм, социалист,
      анархизм, анархист, неблагонадежность, забастовка, стачка, агитация, погром, неблагонадежный, антиправительственный]
    context_only_phrases: [департамент полиции, губернское жандармское управление, гжу]
    context_only_terms: [эмигрант, жандарм, царский]
    contextual_terms: [надзор, цензура, высылка, благонадежность, манифест]
    exclude_phrases: [санитарный надзор, технический надзор]
    review_terms: [надзор, цензура, манифест]
  public_administration:
    minimum_score: 3
    strong_phrases: [назначение на должность, увольнение от должности, увольнение со службы, производство
        в чин, утверждение в должности, штатное расписание, выборы городского головы, выборы гласных,
      состав городской думы, учреждение управления, упразднение управления, делопроизводство канцелярии,
      журнал входящих документов, журнал входящих секретных документов, журнал исходящих документов, журнал
        заседаний, изменение штата, отчет о состоянии города, городовое положение, журнал исходящих секретных
        документов, неблагоприятные аттестации]
    strong_terms: [делопроизводство, чинопроизводство, самоуправление, штат, формулярный]
    context_only_phrases: [министерство внутренних дел, губернское правление, городская дума, военный
        губернатор, генерал-губернатор]
    context_only_terms: [губернатор, чиновник, полицмейстер, министр, канцелярия, магистрат, управа, градоначальник,
      комитет, комиссия, казначейство]
    contextual_terms: [управление, служба, должность, распоряжение]
    context_rules:
    - all: [служба]
      any: [назначение, увольнение, жалованье]
      score: 3
  law_and_police:
    minimum_score: 3
    strong_phrases: [надзор полиции, полицейский надзор, надзором полиции, под стражу, уголовное дело,
      судебное разбирательство, телесные повреждения, нарушение карантинного режима, высылка из города,
      запрещение въезда, запрещение жительства, прекращение розыска, подделка документов, фальшивые деньги,
      по обвинению, разбор жалобы, возбуждение дела, административная высылка, проверка паспортов, отобрание
        паспорта, учреждение наблюдения, негласное наблюдение, охрана кладовой, организация охраны пути,
      охрана императорских поездов]
    strong_terms: [розыск, розыске, розыску, арест, арестованный, арестант, задержание, высылка, выселение,
      тюрьма, заключение, заключенный, преступление, обвинение, убийство, кража, грабеж, мошенничество,
      следствие, приговор, иск, судебный, уголовный, сводничество, шулерство, обыск, похищенный, поддельный,
      фальшивый, ссылка, охрана]
    context_only_phrases: [департамент полиции, городская полиция, криминальная палата]
    context_only_terms: [полиция, полицмейстер, суд, следователь, пристав, жандарм, ссыльный]
    contextual_terms: [надзор, жалоба, наблюдение, правила]
    context_rules:
    - all: [запрещение]
      any: [въезд, выезд, пребывание, жительство]
      score: 3
    - all: [нарушение]
      any: [закон, правила, порядок]
      score: 3
    exclude_phrases: [торговое судно, морское судно, военное судно]
  military_affairs:
    minimum_score: 3
    strong_phrases: [государственная военная коллегия, военная служба, воинская повинность, военная повинность,
      рекрутский набор, военно-судное дело, крымская война, военнопленные французы, квартирное расписание,
      сухопутные войска, поставка в армию, боевой корабль, военный корабль, военное судно, военное положение,
      строительство военных судов, снабжение войск, содержание военнопленных, квартирование солдат, военный
        оркестр]
    strong_terms: [военнопленный, военнопленные, рекрут, новобранец, мобилизация, демобилизация, артиллерия,
      боеприпас, вооружение, гарнизон, фортификация, война, обмундирование, расквартирование, военнослужащий]
    context_only_phrases: [военное министерство, морское министерство, военный губернатор, главный штаб,
      черноморский флот]
    context_only_terms: [военный, морской, офицер, матрос, солдат, адмирал, капитан, лейтенант, поручик,
      командир, флот, армия, полк, адмиралтейство, полковник, генерал]
    contextual_terms: [войско, судно, крепость]
    context_rules:
    - all: [снабжение]
      any: [армия, флот, войско]
      score: 3
    - all: [солдат]
      any: [квартирующий, кормить, содержание]
      score: 3
  economy:
    minimum_score: 3
    strong_phrases: [торговое судно, торговые суда, коммерческий порт, гильдейское удостоверение, сбор
        с товаров, портовый сбор, отправка на экспорт, сверхсметные издержки, фабричное производство,
      промышленное предприятие, торговля краденными вещами, питейная лавка, найм рабочих, расчет с рабочими,
      обеденный перерыв, перепись конского поголовья, неурожай, заработная плата, казенный подряд, взыскание
        недоимок, процентный заем, проверка магазинов, торгующих ядами, ревизия переплетных мастерских]
    strong_terms: [торговля, промышленность, налог, подать, акциз, пошлина, экспорт, импорт, таможня,
      бюджет, смета, издержки, недоимка, подряд, аукцион, аренда, заем, кредит, банк, кораблестроение,
      неурожай, земледелие, урожай, забастовка, стачка, лотерея, издержек]
    context_only_phrases: [акционерное общество]
    context_only_terms: [купец, торговец, рабочий, завод, предприниматель, промышленник, помещик, землевладелец,
      фабрика, судостроительный]
    contextual_terms: [сбор, порт, товар, деньги, плата]
    context_rules:
    - all: [порт]
      any: [торговый, товар, коммерческий, пошлина]
      score: 3
    - all: [рабочий]
      any: [найм, расчет, заработок, волнение, труд]
      score: 3
    - all: [сбор]
      any: [товар, экспорт, торговля]
      score: 3
  population_and_society:
    minimum_score: 3
    strong_phrases: [перепись населения, ревизская ведомость, ревизская сказка, регистрация браков, регистрация
        рождения, регистрация смерти, благотворительное общество, материальная помощь, внебрачный ребенок,
      отдельно от мужа, помощь бедным, призрение бедных, принятие в подданство, выход из подданства, изменение
        сословия, еврейский погром, выселение населения, переселение крестьян]
    strong_terms: [благотворительность, призрение, попечительство, переселение, иммиграция, эмиграция,
      рождаемость, смертность, сиротство, погром, усыновить, усыновление]
    context_only_terms: [купец, мещанин, крестьянин, дворянин, вдова, сирота, еврей, поляк, иностранец,
      подданный, рабочий, жена, дочь, сын, семья, ссыльный]
    contextual_terms: [население, брак, рождение, смерть, паспорт, пособие]
    context_rules:
    - all: [пособие]
      any: [вдова, сирота, семья, бедный]
      score: 3
  personal_files:
    minimum_score: 3
    strong_phrases: [личное дело, личные дела, личная карточка, персональная карточка, формулярный список,
      послужной список, списки учеников, список учеников, списки студентов, список студентов, списки работников,
      список работников, списки служащих, список служащих, список личного состава, списки личного состава]
    strong_terms: []
    context_only_phrases: []
    context_only_terms: []
    contextual_terms: []
    context_rules: []
    exclude_phrases: []
    review_terms: []
  healthcare:
    minimum_score: 3
    strong_phrases: [карантинный режим, карантинные правила, карантинное правило, медицинский осмотр,
      медицинское освидетельствование, врачебная помощь, санитарный надзор, оспопрививание, открытие больницы,
      устройство больницы, медицинское управление, эпидемия холеры, сильно действующие вещества, сильнодействующие
        вещества]
    strong_terms: [эпидемия, холера, чума, оспа, тиф, вакцинация, лечение, здравоохранение, санитария,
      дезинфекция, госпитализация, яд]
    context_only_terms: [карантин, карантинный, лекарь, врач, фельдшер, акушерка, больница, госпиталь,
      аптека]
    contextual_terms: [здоровье, медицинский, санитарный]
    context_rules:
    - all: [больница]
      any: [строительство, открытие, содержание, ремонт]
      score: 3
    - all: [госпиталь]
      any: [строительство, открытие, содержание, ремонт, лечение, больной, госпитализация]
      score: 3
    - all: [аптека]
      any: [открытие, содержание, надзор, проверка, лекарство, фармацевт, провизор]
      score: 3
    - all: [карантин]
      any: [режим, правило, надзор, осмотр, заражение, изоляция, эпидемия, чума, холера, строительство,
        ремонт, содержание, судно]
      score: 3
    - all: [врач]
      any: [назначение, должность, служба, штат, помощь, лечение, осмотр]
      score: 3
  urban_infrastructure:
    minimum_score: 3
    strong_phrases: [мощение улиц, освещение улиц, уличное освещение, ремонт мостовой, строительство моста,
      устройство пристани, ремонт пристани, строительство водопровода, устройство водопровода, телеграфная
        станция, конно-железная дорога, железная дорога, пожарная команда, городское благоустройство,
      строительство здания, строительство порта, ремонт дороги]
    strong_terms: [водопровод, канализация, водосток, мостовая, благоустройство, телеграф, трамвай, мощение,
      освещение, пожар]
    context_only_terms: [улица, дом, порт, пристань, дорога, мост, станция, здание, железнодорожный]
    contextual_terms: [строительство, ремонт, водоснабжение]
    context_rules:
    - all: [ремонт]
      any: [мост, улица, дорога, здание, пристань]
      score: 3
    - all: [строительство]
      any: [мост, дорога, здание, пристань]
      score: 3
    exclude_phrases: [охрана императорских железнодорожных поездов]
  education:
    minimum_score: 3
    strong_phrases: [открытие училища, открытие школы, учреждение училища, учебная программа, народное
        образование, начальное образование, учебное заведение, учебные заведения, обучение детей, прием
        учеников, содержание училища, ремесленное обучение, назначение учителя, учительская семинария,
      допуск студентов в качестве практикантов]
    strong_terms: [образование, обучение, преподавание, педагогика, стипендия, экзамен, учебник]
    context_only_phrases: [ремесленная школа, петровская земледельческая академия, новороссийский университет]
    context_only_terms: [училище, школа, гимназия, университет, академия, студент, ученик, учитель, профессор]
    contextual_terms: [учебный, занятия, практикант]
    context_rules:
    - all: [списки]
      any: [ученик, студент]
      score: 3
    - all: [список]
      any: [ученик, студент]
      score: 3
    - all: [личное дело]
      any: [ученик, студент]
      score: 3
    - all: [училище]
      any: [открытие, учреждение, содержание, преподавание]
      score: 3
    - all: [школа]
      any: [открытие, строительство, обучение]
      score: 3
    exclude_phrases: [образование комиссии, образование комитета, образование управления, бывший ученик
        ремесленной школы]
  culture:
    minimum_score: 3
    strong_phrases: [периодическая печать, периодическое издание, нелегальная литература, запрещенная
        литература, иностранные издания, цензура иностранная, комитет цензуры иностранной, издание газеты,
      литературное общество, музыкальное общество, драматическое общество, театральное представление,
      публичная лекция, народное чтение, открытие библиотеки, издавать справочную газету, фотографический
        снимок, запрещение исполнения, военный оркестр, духовно-нравственное чтение]
    strong_terms: [цензура, цензурирование, театр, спектакль, концерт, музей, археология, древности, библиотека,
      газета, книгопечатание, книготорговля, музыка, литература]
    context_only_terms: [писатель, литератор, редактор, артист, художник, фотограф, книга, журнал, типография]
    contextual_terms: [издание, печать, чтение, общество]
    context_rules:
    - all: [книга]
      any: [запрещенный, разрешенный, цензура, продажа, обращение]
      score: 3
    - all: [журнал]
      any: [издание, редактор, подписка]
      score: 3
    exclude_phrases: [журнал входящих документов, журнал входящих секретных документов, журнал исходящих
        документов, журнал заседаний, метрическая книга, книга учета, печатный бланк]
  religion:
    minimum_score: 3
    strong_phrases: [отречение от православия, переход в раскол, предметы культа, молитвенный дом, раскольничий
        молитвенный дом, церковная служба, духовное звание, духовная консистория, свобода вероисповедания,
      ведомости дел о раскольниках, регистрация браков рождения и смерти раскольников, религиозная пропаганда,
      погребение частных лиц]
    strong_terms: [православие, раскол, секта, ересь, вероисповедание, исповедание, богослужение, молебен,
      крещение, венчание, молельня, монастырь, синагога, костел, мечеть]
    context_only_terms: [священник, священнослужитель, протоиерей, раввин, епископ, духовный, церковь,
      приход, раскольник, скопец, сектант, ксендз, старообрядец]
    contextual_terms: [молитва, религиозный]
    context_rules:
    - all: [церковь]
      any: [строительство, ремонт, освящение, богослужение]
      score: 3
    exclude_phrases: [духовное завещание]
ambiguities:
- term: судно
  do_not_assign: [law_and_police]
- term: освещение
  do_not_assign: [education]
- term: общество
  conditional:
    culture: [литературный, музыкальный, драматический, научный]
    economy: [кредитный, торговый, промышленный, акционерный]
- term: духовный
  exclude_for_religion: [духовное завещание]
- term: книга
  exclude_for_culture: [метрическая книга, книга учета, шнуровая книга]
