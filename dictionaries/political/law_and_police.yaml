schema_version: "1.0"
id: law_and_police
label: "Право, суд і поліція"
macroblock: political
udc_basis:
  - code: "34"
    label: "Право. Юриспруденція"
  - code: "351.74/.76"
    label: "Поліція. Охорона громадського порядку"
description: "Судочинство, поліція, слідство, злочини, покарання, паспорти, розшук і правове регулювання."
minimum_score: 3
strong_phrases:
  - "міська поліція"
  - "департамент поліції"
  - "окружний суд"
  - "сирітський суд"
  - "кримінальна справа"
  - "судове слідство"
  - "поліцейський нагляд"
  - "домашній арешт"
  - "тюремне ув'язнення"
  - "видача паспорта"
  - "підроблення паспорта"
  - "місце заслання"
  - "стягнення боргу"
  - "виконання судового рішення"
  - "військово-судова справа"
  - "поліцейське управління"
  - "тюремне управління"
  - "притягнення до відповідальності"
  - "втеча з-під варти"
  - "місце ув'язнення"
strong_terms:
  - "поліція"
  - "поліцмейстер"
  - "суд"
  - "суддя"
  - "прокурор"
  - "злочин"
  - "крадіжка"
  - "пограбування"
  - "вбивство"
  - "арешт"
  - "в'язниця"
  - "тюрма"
  - "розшук"
  - "слідство"
  - "вирок"
  - "покарання"
  - "паспорт"
  - "заслання"
  - "вислання"
  - "арештант"
  - "ув'язнення"
  - "секвестр"
  - "пристав"
  - "стряпчий"
  - "дезертир"
contextual_terms:
  - "скарга"
  - "борг"
  - "вексель"
  - "позов"
  - "свідок"
  - "доказ"
  - "правопорушення"
  - "нагляд"
  - "затримання"
context_rules:
  - all: ["стягнення", "борг"]
    score: 3
  - all: ["розглянути", "скарга"]
    any: ["суд", "поліція", "прокурор"]
    score: 3
  - all: ["встановити", "особа"]
    any: ["розшук", "паспорт", "злочин"]
    score: 3
  - all: ["втеча", "варта"]
    score: 3
  - all: ["притягнення", "відповідальність"]
    score: 3
exclude_phrases:
  - "судно торговельне"
  - "судно іноземне"
  - "медичний нагляд"
  - "санітарний нагляд"
review_terms:
  - "суд"
  - "нагляд"
  - "скарга"
  - "борг"
