schema_version: "1.0"
id: public_administration
label: "Державне та місцеве управління"
macroblock: political
udc_basis:
  - code: "35"
    label: "Державне адміністративне управління. Військова справа"
  - code: "352"
    label: "Місцеве управління"
description: "Організація органів влади, міського самоврядування, адміністративних установ, штатів і державної служби."
minimum_score: 3
strong_phrases:
  - "міська дума"
  - "приміська дума"
  - "міська управа"
  - "міщанська управа"
  - "земська управа"
  - "міське громадське управління"
  - "губернське правління"
  - "міський магістрат"
  - "міський голова"
  - "генерал-губернатор"
  - "міністерство внутрішніх справ"
  - "департамент загальних справ"
  - "господарський департамент"
  - "казенна палата"
  - "контрольна палата"
  - "палата державного майна"
  - "городовий комітет"
  - "присутствене місце"
  - "штат установи"
  - "штат чиновників"
  - "державна служба"
  - "військове губернаторство"
  - "міський архітектор"
  - "державна рада"
  - "статистичний комітет"
  - "особливе у міських справах присутствіє"
  - "податне присутствіє"
  - "призначення на посаду"
  - "звільнення з посади"
  - "присвоєння чину"
  - "зарахування на службу"
  - "службове відрядження"
  - "управління військового губернатора"
  - "просування по службі"
  - "службовці управління"
strong_terms:
  - "самоврядування"
  - "магістрат"
  - "муніципалітет"
  - "чиновник"
  - "канцелярія"
  - "департамент"
  - "міністерство"
  - "сенат"
  - "градоначальник"
  - "присутствіє"
contextual_terms:
  - "комітет"
  - "комісія"
  - "управа"
  - "правління"
  - "штат"
  - "служба"
  - "призначення"
  - "звільнення"
  - "затвердження"
  - "обіжник"
  - "постанова"
  - "інструкція"
  - "положення"
context_rules:
  - all: ["призначення", "чиновник"]
    score: 3
  - all: ["звільнення", "служба"]
    any: ["чиновник", "посада", "установа"]
    score: 3
  - all: ["затвердити", "штат"]
    score: 3
  - all: ["організація", "установа"]
    score: 3
  - all: ["протокол", "засідання"]
    any: ["дума", "управа", "комітет", "комісія", "присутствене місце"]
    score: 3
  - all: ["нагородження"]
    any: ["служба", "чин", "чиновник"]
    score: 3
  - all: ["присвоєння", "чин"]
    score: 3
  - all: ["зарахування", "служба"]
    score: 3
  - all: ["призначення", "посада"]
    score: 3
exclude_phrases:
  - "духовне правління"
  - "правління товариства"
  - "опікунська рада навчального закладу"
review_terms:
  - "комісія"
  - "комітет"
  - "правління"
  - "служба"
  - "канцелярія"
