schema_version: "1.0"
id: politics
label: "Політика і політичний нагляд"
macroblock: political
udc_basis:
  - code: "32"
    label: "Політика"
  - code: "323"
    label: "Внутрішні справи. Внутрішня політика"
description: "Політичні рухи, державна безпека, політичний нагляд, цензура та переслідування за політичними мотивами."
minimum_score: 3
strong_phrases:
  - "політична благонадійність"
  - "політичний нагляд"
  - "політичний розшук"
  - "політичний злочин"
  - "державний злочин"
  - "таємне товариство"
  - "польське повстання"
  - "заборонена література"
  - "революційна пропаганда"
  - "політичний арештант"
  - "політичний засланець"
  - "іноземна цензура"
  - "справа про друк"
  - "головне управління у справах друку"
  - "політична неблагонадійність"
strong_terms:
  - "політика"
  - "політичний"
  - "революція"
  - "революційний"
  - "повстання"
  - "заколот"
  - "бунт"
  - "прокламація"
  - "соціалізм"
  - "соціаліст"
  - "анархізм"
  - "анархіст"
  - "неблагонадійний"
  - "неблагонадійність"
contextual_terms:
  - "благонадійність"
  - "цензура"
  - "нагляд"
  - "пропаганда"
  - "еміграція"
  - "заслання"
  - "вислання"
  - "маніфест"
  - "друк"
  - "література"
context_rules:
  - all: ["цензура", "твір"]
    score: 3
  - all: ["нагляд", "особа"]
    any: ["політичний", "неблагонадійний", "заслання"]
    score: 3
  - all: ["видати", "свідоцтво", "благонадійність"]
    score: 3
exclude_phrases:
  - "технічний нагляд"
  - "санітарний нагляд"
  - "поліцейський нагляд за торгівлею"
review_terms:
  - "нагляд"
  - "цензура"
  - "маніфест"
