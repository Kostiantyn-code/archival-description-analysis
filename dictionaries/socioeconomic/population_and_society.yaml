schema_version: "1.0"
id: population_and_society
label: "Населення і соціальна сфера"
macroblock: socioeconomic
udc_basis:
  - code: "31"
    label: "Демографія. Соціологія. Статистика"
  - code: "314"
    label: "Демографія. Вивчення населення"
  - code: "36"
    label: "Соціальна допомога. Соціальне забезпечення"
description: "Населення, стани і соціальні групи, міграція, родина, опіка, бідність, допомога, пенсійне забезпечення і благодійність."
minimum_score: 3
strong_phrases:
  - "перепис населення"
  - "рух населення"
  - "соціальний стан"
  - "міщанське товариство"
  - "дворянське зібрання"
  - "іноземний підданий"
  - "прийняття підданства"
  - "болгарський переселенець"
  - "єврейська громада"
  - "сирітський суд"
  - "соціальна допомога"
  - "грошова допомога"
  - "призначення пенсії"
  - "богадільня"
  - "благодійне товариство"
  - "опіка над сиротою"
  - "почесний громадянин"
  - "право проживання"
  - "вільне проживання"
  - "посвідка на проживання"
  - "одноразова допомога"
  - "допомога вдові"
  - "вдове свідоцтво"
  - "опіка над майном"
  - "народна тверезість"
  - "приказ громадського піклування"
strong_terms:
  - "населення"
  - "перепис"
  - "міщанин"
  - "дворянин"
  - "селянин"
  - "кріпак"
  - "переселенець"
  - "колоніст"
  - "емігрант"
  - "іммігрант"
  - "підданство"
  - "громада"
  - "сирота"
  - "богадільня"
  - "благодійність"
  - "пенсія"
  - "утриманець"
  - "переселення"
contextual_terms:
  - "іноземець"
  - "купець"
  - "вдова"
  - "родина"
  - "шлюб"
  - "народження"
  - "смерть"
  - "опіка"
  - "допомога"
  - "бідність"
  - "притулок"
  - "товариство"
  - "паспорт"
  - "проживання"
context_rules:
  - all: ["призначення", "пенсія"]
    score: 3
  - all: ["надати", "допомога"]
    any: ["вдова", "сирота", "бідність", "родина"]
    score: 3
  - all: ["дозвіл", "проживання"]
    any: ["іноземець", "переселенець", "підданий"]
    score: 3
  - all: ["опіка", "майно"]
    any: ["сирота", "неповнолітній"]
    score: 3
  - all: ["надання", "допомога"]
    any: ["вдова", "сирота", "родина", "бідність"]
    score: 3
  - all: ["видача", "допомога"]
    any: ["вдова", "сирота", "родина", "бідність"]
    score: 3
  - all: ["підданий"]
    any: ["турецький", "австрійський", "прусський", "грецький", "перський", "баварський", "молдавський"]
    score: 3
exclude_phrases:
  - "допомога поліції"
  - "технічна допомога"
  - "військовий стан"
review_terms:
  - "допомога"
  - "товариство"
  - "громада"
  - "стан"
  - "іноземець"
