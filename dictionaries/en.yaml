version: 1.0-reviewed-draft
validation_status: structural_and_contrastive_checks_only
provenance:
  lexical_terms: Author-composed search vocabulary; not an official UDC schedule or translation.
  udc_mapping: Author alignment to broader UDC subject classes; no automatic assignment of a full UDC
    number.
  checked_on: '2026-10-23'
  udc_owner: UDC Consortium
  sources: ['https://udcsummary.info/php/index.php?lang=en', 'https://udcc.org/index.php/site/page?view=subject_coverage',
    'https://www.w3.org/TR/skos-reference/', 'https://udcc.org/index.php/site/page?view=factsheet']
  method: Shared concept identities and language-specific lexical labels, inspired by SKOS; UDC numbers
    are broader subject anchors, never proof of lexical equivalence.
