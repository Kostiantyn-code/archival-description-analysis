schema_version: "1.0"
id: cross_category_ambiguities
description: "Міжкатегоріальні омоніми та контекстні обмеження, виявлені під час перегляду корпусу."
rules:
  - term: "освітлення"
    do_not_assign: [education]
    prefer: [urban_infrastructure]
    note: "Не є словоформою поняття «освіта»."
  - term: "судно"
    do_not_assign: [law_and_police]
    prefer: [military_affairs, economy]
    note: "Морське судно, а не судова установа."
  - term: "книга"
    conditional:
      culture: ["друк", "видання", "продаж", "цензура", "бібліотека"]
      religion: ["метричний", "парафія", "церква"]
    exclude_for_culture: ["шнурова книга", "книга запису", "метрична книга"]
  - term: "журнал"
    conditional:
      culture: ["видання", "друк", "передплата", "редактор"]
    exclude_for_culture: ["журнал вхідних документів", "журнал вихідних документів", "журнал засідань"]
  - term: "духовний"
    conditional:
      religion: ["правління", "консисторія", "училище", "відомство"]
    exclude_for_religion: ["духовний заповіт"]
  - term: "команда"
    conditional:
      military_affairs: ["військовий", "морський", "портовий"]
      law_and_police: ["поліцейський"]
      urban_infrastructure: ["пожежний"]
  - term: "порт"
    conditional:
      military_affairs: ["флот", "військовий", "адміралтейство"]
      urban_infrastructure: ["споруда", "пристань", "будівництво", "ремонт"]
      economy: ["торгівля", "товар", "мито", "комерційний"]
  - term: "товариство"
    conditional:
      economy: ["кредитний", "торговельний", "промисловий", "акціонерний"]
      population_and_society: ["міщанський", "благодійний", "допомога"]
      culture: ["літературний", "музичний", "драматичний", "науковий"]
  - term: "нагляд"
    conditional:
      politics: ["політичний", "благонадійність", "засланець"]
      law_and_police: ["поліцейський", "арештант", "злочинець"]
      healthcare: ["санітарний", "медичний", "карантинний"]
  - term: "зібрання"
    conditional:
      culture: ["громадський", "літературний", "музичний"]
      public_administration: ["засідання", "дума", "комітет", "комісія"]
